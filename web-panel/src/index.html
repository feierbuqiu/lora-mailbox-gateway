<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>LoRa 邮箱监控</title>
<style>
:root {
  --bg:#f5f6f8; --surface:#fff; --text:#1a1d21; --muted:#667085;
  --border:#d9dee7; --green:#168a4a; --yellow:#b7791f; --red:#c24135;
  --primary:#2563eb; --secondary:#475467;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#111418; --surface:#1c2128; --text:#e6e8ea; --muted:#9aa3ad; --border:#303846; }
}
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
main { width:min(760px, 100%); margin:0 auto; padding:18px; }
header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:4px 0 16px; }
h1 { font-size:22px; margin:0; }
.status { color:var(--muted); font-size:13px; }
.grid { display:grid; grid-template-columns:1fr; gap:12px; }
@media (min-width:720px) { .grid { grid-template-columns:1.15fr .85fr; } }
.panel { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:16px; }
.state { min-height:180px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
.state strong { font-size:28px; margin-bottom:8px; }
.state span { color:var(--muted); font-size:14px; }
.rows { display:grid; gap:8px; }
.row { display:flex; justify-content:space-between; gap:16px; font-size:14px; }
.row .label { color:var(--muted); }
.dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; background:#98a2b3; }
.ok { background:var(--green); } .warn { background:var(--yellow); } .bad { background:var(--red); }
.actions { display:grid; gap:10px; margin-top:12px; }
button { border:0; border-radius:6px; padding:12px 14px; font-weight:650; font-size:14px; color:#fff; background:var(--primary); cursor:pointer; }
button.secondary { background:transparent; color:var(--secondary); border:1px solid var(--border); }
button:disabled { opacity:.55; cursor:not-allowed; }
.low { color:var(--red); font-weight:700; }
footer { color:var(--muted); font-size:12px; text-align:center; padding:18px 0 8px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>LoRa 邮箱</h1>
    <div id="connection" class="status">正在加载配置</div>
  </header>

  <div class="grid">
    <section class="panel state" id="statePanel">
      <strong id="stateText">正在等待数据</strong>
      <span id="stateDetail">尚未收到 MQTT 保留状态。</span>
    </section>

    <section class="panel">
      <div class="rows">
        <div class="row"><span class="label">邮箱节点</span><span id="nodeHealth"><span class="dot"></span>未知</span></div>
        <div class="row"><span class="label">家庭网关</span><span id="gateway"><span class="dot"></span>未知</span></div>
        <div class="row"><span class="label">心跳时间</span><span id="heartbeatAge">-</span></div>
        <div class="row"><span class="label">电池</span><span id="battery">-</span></div>
        <div class="row"><span class="label">电池数据来源</span><span id="batterySource">-</span></div>
        <div class="row"><span class="label">电量告警</span><span id="batteryAlert">-</span></div>
        <div class="row"><span class="label">节点模式</span><span id="mode">-</span></div>
        <div class="row"><span class="label">采样状态</span><span id="sampling">-</span></div>
        <div class="row"><span class="label">运行时间</span><span id="uptime">-</span></div>
        <div class="row"><span class="label">最近事件</span><span id="event">-</span></div>
        <div class="row"><span class="label">离线监控</span><span id="alarm">-</span></div>
      </div>
    </section>
  </div>

  <section class="panel actions">
    <button id="resetBtn" disabled>标记为已取件</button>
    <button id="hbBtn" class="secondary">请求心跳</button>
    <button id="modeBtn" class="secondary">切换调试模式</button>
    <button id="testBtn" class="secondary">发送测试投递</button>
    <button id="maintBtn" class="secondary">暂停离线监控</button>
  </section>

  <footer>已通过身份验证。登录后，MQTT 凭据由 Worker 环境变量安全加载。</footer>
</main>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
"use strict";

const $ = (id) => document.getElementById(id);
let config;
let topics;
let status = null;
let heartbeat = null;
let calibratedStatus = null;
let calibratedHeartbeat = null;
let gateway = null;
let mode = null;
let client = null;

function dot(className, text) {
  return '<span class="dot ' + className + '"></span>' + text;
}

function fmtAge(epochSeconds) {
  if (!epochSeconds) return "-";
  const minutes = Math.floor((Date.now() / 1000 - epochSeconds) / 60);
  if (minutes < 1) return "刚刚";
  if (minutes < 60) return minutes + " 分钟前";
  const hours = Math.floor(minutes / 60);
  if (hours < 48) return hours + " 小时前";
  return Math.floor(hours / 24) + " 天前";
}

function fmtUptime(seconds) {
  if (seconds == null) return "-";
  if (seconds < 3600) return Math.floor(seconds / 60) + " 分钟";
  if (seconds < 86400) return (seconds / 3600).toFixed(1) + " 小时";
  return (seconds / 86400).toFixed(1) + " 天";
}

function currentDebugMode() {
  if (heartbeat && typeof heartbeat.debug === "boolean") return heartbeat.debug;
  if (status && typeof status.debug === "boolean") return status.debug;
  if (mode) return mode === "debug";
  return false;
}

function currentSampling() {
  if (heartbeat && typeof heartbeat.sampling === "boolean") return heartbeat.sampling;
  if (status && typeof status.sampling === "boolean") return status.sampling;
  return null;
}

function currentBatteryTelemetry() {
  if (calibratedHeartbeat && calibratedHeartbeat.calibrated === true) return calibratedHeartbeat;
  if (heartbeat && heartbeat.calibrated === true) return heartbeat;
  return heartbeat;
}

function currentBatteryAlert() {
  if (calibratedStatus && calibratedStatus.battery_calibrated === true && calibratedStatus.battery_alert) {
    return calibratedStatus.battery_alert;
  }
  if (calibratedHeartbeat && calibratedHeartbeat.calibrated === true && calibratedHeartbeat.battery_alert) {
    return calibratedHeartbeat.battery_alert;
  }
  if (status && status.battery_calibrated === true && status.battery_alert) return status.battery_alert;
  if (heartbeat && heartbeat.calibrated === true && heartbeat.battery_alert) return heartbeat.battery_alert;
  if (status && status.battery_alert) return status.battery_alert;
  if (heartbeat && heartbeat.battery_alert) return heartbeat.battery_alert;
  return null;
}

function heartbeatStatus() {
  return status && status.heartbeat_status ? status.heartbeat_status : null;
}

function render() {
  const stale = heartbeat ? (Date.now() / 1000 - heartbeat.ts) > config.staleMinutes * 60 : null;
  const hbStatus = heartbeatStatus();
  const probing = hbStatus === "probing";
  const offline = hbStatus === "offline_confirmed";
  const state = status ? status.state : null;

  if (offline) {
    $("stateText").textContent = "节点离线";
    $("stateDetail").textContent = "家庭网关已确认多次心跳探测均未响应。";
  } else if (probing) {
    $("stateText").textContent = "心跳延迟";
    $("stateDetail").textContent = "家庭网关正在探测，确认后才会发送告警。";
  } else if (stale) {
    $("stateText").textContent = "心跳过期";
    $("stateDetail").textContent = config.staleMinutes + " 分钟内未收到心跳。";
  } else if (state === "DELIVERED") {
    $("stateText").textContent = "有邮件待取";
    $("stateDetail").textContent = status.reset_pending ? "重置命令正在通过 LoRa 发送。" : "取件后请在下方标记为已取件。";
  } else if (state === "ARMED") {
    $("stateText").textContent = "监控中";
    $("stateDetail").textContent = "邮箱当前为空，正在等待投递。";
  } else {
    $("stateText").textContent = state ? "状态：" + state : "正在等待数据";
    $("stateDetail").textContent = "正在等待 MQTT 保留状态。";
  }

  $("nodeHealth").innerHTML = offline ? dot("bad", "离线")
    : probing ? dot("warn", "探测中")
    : stale === null ? dot("", "未知")
    : stale ? dot("bad", "心跳过期") : dot("ok", "正常");
  $("gateway").innerHTML = gateway === "online" ? dot("ok", "在线")
    : gateway === "offline" ? dot("bad", "离线") : dot("", "未知");
  $("heartbeatAge").textContent = heartbeat ? fmtAge(heartbeat.ts) : "-";
  const battery = currentBatteryTelemetry();
  $("battery").innerHTML = battery && battery.mv > 0
    ? ((battery.low ? '<span class="low">' : "") + (battery.mv / 1000).toFixed(2) + " V / " + (battery.pct >= 0 ? battery.pct + "%" : "未知") + (battery.low ? "</span>" : ""))
    : "-";
  if (battery && battery.calibrated === true) {
    const offset = Number.isFinite(Number(battery.calibration_offset_mv))
      ? (Number(battery.calibration_offset_mv) >= 0 ? "+" : "") + Number(battery.calibration_offset_mv) + " mV"
      : "";
    const samples = Number.isFinite(Number(battery.filtered_samples))
      ? Number(battery.filtered_samples) + " 个样本"
      : "";
    const details = [offset, samples].filter(Boolean);
    $("batterySource").textContent = "云端校准" + (details.length ? "（" + details.join("，") + "）" : "");
  } else {
    $("batterySource").innerHTML = battery ? '<span class="low">节点原始读数</span>' : "-";
  }
  const alert = currentBatteryAlert();
  $("batteryAlert").innerHTML = alert === "critical" ? '<span class="low">严重低电量</span>'
    : alert === "low" ? '<span class="low">低电量</span>'
    : alert === "invalid" ? '<span class="low">读数无效</span>'
    : alert === "ok" ? "正常" : "-";
  const debug = currentDebugMode();
  const sampling = currentSampling();
  $("mode").textContent = debug ? "调试" : "正常";
  $("sampling").textContent = sampling === null ? "-" : sampling ? "采样中" : "空闲";
  const liveUptime = heartbeat ? heartbeat.uptime + Math.max(0, Math.floor(Date.now() / 1000 - heartbeat.ts)) : null;
  $("uptime").textContent = fmtUptime(liveUptime);
  $("event").textContent = status ? "#" + status.last_event_seq : "-";
  $("modeBtn").textContent = debug ? "返回正常模式" : "启用调试模式";

  if (state === "DELIVERED" && !status.reset_pending) {
    $("resetBtn").disabled = false;
    $("resetBtn").textContent = "标记为已取件";
  } else if (status && status.reset_pending) {
    $("resetBtn").disabled = true;
    $("resetBtn").textContent = "正在重置";
  } else {
    $("resetBtn").disabled = true;
    $("resetBtn").textContent = "标记为已取件";
  }
}

function publish(topic, payload, options) {
  if (!client || !client.connected) return;
  client.publish(topic, payload, options || { qos: 1 });
}

async function loadConfig() {
  const response = await fetch("/api/config");
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || "配置请求失败（HTTP " + response.status + "）");
  config = data;
  topics = {
    status: config.topicPrefix + "/status",
    heartbeat: config.topicPrefix + "/heartbeat",
    calibratedStatus: config.topicPrefix + "/status-calibrated",
    calibratedHeartbeat: config.topicPrefix + "/heartbeat-calibrated",
    gateway: config.topicPrefix + "/gateway",
    reset: config.topicPrefix + "/reset",
    command: config.topicPrefix + "/command",
    mode: config.topicPrefix + "/mode",
  };
}

function connectMqtt() {
  $("connection").textContent = "正在连接";
  client = mqtt.connect(config.mqttUrl, {
    username: config.mqttUsername,
    password: config.mqttPassword,
    clientId: "panel-" + Math.random().toString(16).slice(2, 10),
    keepalive: 30,
    reconnectPeriod: 4000,
    clean: true,
  });
  client.on("connect", () => {
    $("connection").textContent = "已连接";
    client.subscribe(config.topicPrefix + "/#");
  });
  client.on("reconnect", () => { $("connection").textContent = "正在重连"; });
  client.on("close", () => { $("connection").textContent = "已断开"; });
  client.on("error", (error) => { $("connection").textContent = "MQTT 错误：" + error.message; });
  client.on("message", (topic, payload) => {
    const text = payload.toString();
    try {
      if (topic === topics.status) status = JSON.parse(text);
      else if (topic === topics.heartbeat) heartbeat = JSON.parse(text);
      else if (topic === topics.calibratedStatus) calibratedStatus = JSON.parse(text);
      else if (topic === topics.calibratedHeartbeat) calibratedHeartbeat = JSON.parse(text);
      else if (topic === topics.gateway) gateway = text;
      else if (topic === topics.mode) mode = text.trim();
    } catch (error) {
      console.warn("bad payload", topic, text, error);
    }
    render();
  });
}

async function refreshMaintenance() {
  try {
    const response = await fetch("/api/maintenance");
    if (!response.ok) throw new Error(String(response.status));
    const data = await response.json();
    const statusText = {
      up: "正常",
      paused: "已暂停",
      down: "故障",
      grace: "等待中",
      new: "尚未检测",
    };
    $("alarm").textContent = statusText[data.status] || data.status || "-";
    $("maintBtn").disabled = data.status === "paused";
  } catch {
    $("alarm").textContent = "未配置";
    $("maintBtn").disabled = true;
  }
}

$("resetBtn").addEventListener("click", () => {
  if (!confirm("确认已取走邮箱中的邮件吗？")) return;
  publish(topics.reset, "collected");
});

$("hbBtn").addEventListener("click", () => publish(topics.command, "hb"));

$("modeBtn").addEventListener("click", () => {
  publish(topics.mode, currentDebugMode() ? "normal" : "debug", { qos: 1, retain: true });
});

$("testBtn").addEventListener("click", () => {
  if (!confirm("发送一次完整的测试投递事件吗？")) return;
  publish(topics.command, "test");
});

$("maintBtn").addEventListener("click", async () => {
  if (!confirm("维护期间暂停离线告警吗？")) return;
  const response = await fetch("/api/maintenance", { method: "POST" });
  if (!response.ok) alert("暂停离线监控失败。");
  await refreshMaintenance();
});

(async function main() {
  try {
    await loadConfig();
    connectMqtt();
    await refreshMaintenance();
    render();
    setInterval(render, 30000);
    setInterval(refreshMaintenance, 120000);
  } catch (error) {
    $("connection").textContent = "配置错误";
    $("stateText").textContent = "面板尚未配置";
    $("stateDetail").textContent = error.message;
  }
})();
</script>
</body>
</html>
