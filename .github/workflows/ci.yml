name: CI

on:
  push:
  pull_request:

jobs:
  firmware:
    name: Firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Use example firmware config
        run: cp firmware/include/lora_mail_config.example.h firmware/include/lora_mail_config.h
      - name: Build firmware
        run: platformio run -d firmware -e home -e mail -e hello

  web-panel:
    name: Web Panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-panel/package-lock.json
      - name: Install dependencies
        working-directory: web-panel
        run: npm ci
      - name: Build panel
        working-directory: web-panel
        run: npm run build
      - name: Test passkey registration options
        working-directory: web-panel
        run: npm test

  cloud-battery-monitor:
    name: Cloud Battery Monitor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud-battery-monitor/package-lock.json
      - name: Install dependencies
        working-directory: cloud-battery-monitor
        run: npm ci
      - name: Run unit tests
        working-directory: cloud-battery-monitor
        run: npm test
      - name: Validate Worker bundle
        working-directory: cloud-battery-monitor
        run: npx wrangler deploy --dry-run
