name: Publish Web Panel Package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@feierbuqiu"
          cache: npm
          cache-dependency-path: web-panel/package-lock.json
      - name: Install dependencies
        working-directory: web-panel
        run: npm ci
      - name: Build package
        working-directory: web-panel
        run: npm run build
      - name: Inspect package contents
        working-directory: web-panel
        run: npm pack --dry-run
      - name: Publish package
        working-directory: web-panel
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@feierbuqiu/lora-mailbox-panel@${VERSION}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "Package version ${VERSION} is already published."
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
